name: Carly compare once
on:
  push:
    branches: [compare-carly-20260902]

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Call Carly production once
        run: |
          python - <<'PY'
          import json, urllib.request
          prompt = "Necesito un carro cómodo para ir a la universidad. Manejo unos 20 km al día y no quiero pagar más de US$500 al mes."
          payload = json.dumps({
              "messages": [{"role": "user", "content": prompt}],
              "country": "sv",
              "top_n": 6,
          }).encode("utf-8")
          req = urllib.request.Request(
              "https://cartrade-resolver.onrender.com/carly/chat",
              data=payload,
              headers={"Content-Type": "application/json", "User-Agent": "CarTrade-Carly-Compare/1.0"},
              method="POST",
          )
          with urllib.request.urlopen(req, timeout=60) as r:
              data = json.loads(r.read().decode("utf-8"))
          print("PROMPT:", prompt)
          print("CARLY_JSON:")
          print(json.dumps(data, ensure_ascii=False, indent=2))
          PY
