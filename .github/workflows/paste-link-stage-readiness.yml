name: Carly staging offline coverage readiness smoke
on:
  pull_request:
    paths:
      - "scripts/paste_link_stage_readiness_smoke.py"
      - ".github/workflows/paste-link-stage-readiness.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  staging-health-and-ledger:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install httpx==0.27.2
      - run: python scripts/paste_link_stage_readiness_smoke.py
