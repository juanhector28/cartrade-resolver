name: Carly v59 freeze freshness

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  freeze-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt pytest
      - name: Keep all 120 GT certified rows fresh through Tuesday
        run: python -m pytest -q tests/test_carly_v59_freeze_freshness.py
      - name: Check freshness syntax
        run: python -m py_compile app/atlas_freshness_api.py app/main_v50.py tests/test_carly_v59_freeze_freshness.py
