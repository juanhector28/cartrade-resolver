name: Carly random 10 v31 audit

on:
  push:
    branches:
      - carly-random-10-20260902

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Run 10 production prompts in parallel
        shell: bash
        run: |
          python - <<'PY'
          import json, urllib.request
          from concurrent.futures import ThreadPoolExecutor, as_completed

          URL = "https://cartrade-resolver.onrender.com/carly/chat"
          cases = [
            (1, "Exact RAV4", "Solo quiero un Toyota RAV4. No me enseñes otros modelos. Máximo US$650 al mes."),
            (2, "Exact CRV year floor", "Busco un Honda CR-V 2024 o más nuevo. Si no hay uno exacto, dímelo antes de mostrar alternativas. Máximo US$450 al mes."),
            (3, "Only sedan automatic", "Quiero únicamente sedán automático para ciudad. Máximo US$400 al mes."),
            (4, "Farm heavy cargo", "Quiero un carro para ir a la finca los fines de semana. Camino de grava, 3 pasajeros, herramientas y carga pesada. Máximo US$500 al mes."),
            (5, "Family five", "Somos familia de 5 con un bebé. Ciudad entre semana y carretera algunos fines de semana. Máximo US$550 al mes."),
            (6, "Delivery cheapest", "Quiero el carro más barato posible para hacer delivery todos los días, pero que no sea una mala compra. Máximo US$250 al mes."),
            (7, "Typo exact", "Quiero una Toyta Rav4 para uso diario, máximo US$500 al mes."),
            (8, "Pickup automatic", "Necesito una pickup automática doble cabina para trabajo de construcción y cargar herramientas. Máximo US$600 al mes."),
            (9, "Comfort student", "Necesito un carro cómodo para ir a la universidad. Manejo unos 20 km al día y no quiero pagar más de US$500 al mes."),
            (10, "Contradiction", "Quiero una pickup pequeña para ciudad, automática, pero que pueda llevar 5 adultos cómodos. Máximo US$350 al mes."),
          ]

          def slim(car):
            if not isinstance(car, dict): return {}
            keys=("make","model","year","price_usd","km","monthly_est","monthly_payment","match_pct","body_type","transmission","best_for","caveat","strategy_label")
            return {k:car.get(k) for k in keys if car.get(k) is not None}

          def run_case(case):
            num,label,prompt=case
            item={"case":num,"label":label,"prompt":prompt}
            try:
              payload=json.dumps({"messages":[{"role":"user","content":prompt}],"country":"sv","top_n":6}).encode()
              req=urllib.request.Request(URL,data=payload,headers={"Content-Type":"application/json","User-Agent":"CarTrade-Carly-Audit/1.2"},method="POST")
              with urllib.request.urlopen(req,timeout=90) as r:
                data=json.loads(r.read().decode())
              item.update({"http":200,"phase":data.get("phase"),"reply":data.get("reply"),"profile":data.get("profile"),"recommendations":[slim(c) for c in (data.get("recommendations") or [])],"explore":[slim(c) for c in (data.get("explore") or [])],"brain":data.get("recommendation_brain"),"advisor_mode":data.get("advisor_mode")})
            except Exception as e:
              item.update({"http":"error","error":repr(e)})
            return item

          results=[]
          with ThreadPoolExecutor(max_workers=10) as ex:
            futures=[ex.submit(run_case,c) for c in cases]
            for f in as_completed(futures):
              item=f.result(); results.append(item)
              print("CARLY_V31_CASE="+json.dumps(item,ensure_ascii=False),flush=True)
          results.sort(key=lambda x:x["case"])
          print("CARLY_V31_ALL="+json.dumps(results,ensure_ascii=False),flush=True)
          PY
