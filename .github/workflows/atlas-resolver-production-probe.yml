name: Atlas Resolver production probe

on:
  pull_request:
    paths:
      - ".github/workflows/atlas-resolver-production-probe.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - name: Probe known Resolver surfaces
        run: |
          python - <<'PY'
          import json, urllib.error, urllib.request
          bases = [
              "https://resolver.cartrade.live",
              "https://cartrade-resolver-production.up.railway.app",
              "https://cartrade-resolver.onrender.com",
          ]
          for base in bases:
              print("\nBASE=" + base)
              for path in ("/health", "/atlas/runner/status", "/carly/runtime"):
                  url = base + path
                  try:
                      req = urllib.request.Request(url, headers={"User-Agent":"cartrade-resolver-prod-probe"})
                      with urllib.request.urlopen(req, timeout=12) as r:
                          body = r.read(1200).decode(errors="replace")
                          print(json.dumps({"path":path,"status":r.status,"final_url":r.geturl(),"body":body}, ensure_ascii=False))
                  except urllib.error.HTTPError as exc:
                      body = exc.read(1200).decode(errors="replace")
                      print(json.dumps({"path":path,"status":exc.code,"body":body}, ensure_ascii=False))
                  except Exception as exc:
                      print(json.dumps({"path":path,"error_type":type(exc).__name__,"error":str(exc)}, ensure_ascii=False))
          PY
