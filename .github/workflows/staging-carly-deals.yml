name: Staging Carly Deals smoke tests
on:
  push:
    branches: ['feat/carly-deals-multirol']
    paths:
      - 'staging/**'
      - 'app/deals_api.py'
      - 'tests/test_broker_staging.py'
      - '.github/workflows/staging-carly-deals.yml'
  pull_request:
    paths:
      - 'staging/**'
      - 'app/deals_api.py'
      - 'tests/test_broker_staging.py'
      - '.github/workflows/staging-carly-deals.yml'
jobs:
  staging-tests:
    runs-on: ubuntu-latest
    permissions: {contents: read}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: python -m pip install 'fastapi==0.115.0' 'httpx==0.27.2' 'pydantic==2.9.2' 'supabase==2.7.4' 'pytest>=8,<9'
      - run: python -m py_compile staging/api.py app/deals_api.py tests/test_broker_staging.py
      - name: Validate browser module syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          html = Path('staging/index.html').read_text()
          m = re.search(r'<script type="module">([\s\S]*?)</script>', html)
          assert m, 'Browser module not found'
          Path('staging/ui-check.mjs').write_text(m.group(1))
          PY
          node --check staging/ui-check.mjs
      - run: python -m pytest tests/test_broker_staging.py tests/test_deals_api.py -q
