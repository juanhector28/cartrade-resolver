name: Carly v40 constraint semantics

on:
  push:
    branches: [carly-v39-constraint-semantics]
  pull_request:
    paths:
      - 'app/main_v39.py'
      - 'app/main_v40.py'
      - 'tests/test_carly_v39.py'
      - 'tests/test_carly_v40.py'
      - 'Dockerfile'
      - '.github/workflows/carly-v39-regression.yml'

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      CACHE_DB: /tmp/carly-v40-cache.db
      TRUSTPLUS_DB: /tmp/carly-v40-trustplus.db
      CARLY_VISION_JIT_ENABLED: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt pytest
      - name: Run v40 regressions
        run: python -m pytest -q tests/test_carly_v40.py
      - name: Run v31-v38 recommendation regressions
        run: |
          python -m pytest -q tests/test_carly_v31.py
          python -m pytest -q tests/test_carly_v32.py
          python -m pytest -q tests/test_carly_v32_stress15.py
          python -m pytest -q tests/test_carly_v33_complex15.py
          python -m pytest -q tests/test_carly_v34.py
          python -m pytest -q tests/test_carly_v35.py
          python -m pytest -q tests/test_carly_v36.py
          python -m pytest -q tests/test_carly_v37.py
          python -m pytest -q tests/test_carly_v38.py
      - name: Check v40 entrypoint and syntax
        run: |
          grep -q 'CMD uvicorn app.main_v40:app' Dockerfile
          python -m py_compile app/main_v39.py app/main_v40.py tests/test_carly_v40.py
