name: Carly v36 vision gate regression

on:
  pull_request:
    paths:
      - 'app/main_v36.py'
      - 'tests/test_carly_v36.py'
      - '.github/workflows/carly-v36-regression.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  v36-vision-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CACHE_DB: /tmp/carly-v36-cache.db
      TRUSTPLUS_DB: /tmp/carly-v36-trustplus.db
      CARLY_VISION_JIT_ENABLED: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt pytest
      - name: Run v36 regressions
        run: python -m pytest -q tests/test_carly_v36.py
      - name: Check v36 syntax
        run: python -m py_compile app/main_v36.py tests/test_carly_v36.py
