name: Julajups isolated listing diagnosis
# Completed one-shot source audit. Run manually only to avoid repeated third-party requests.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  two-source-pages:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-paste-link-staging.txt
      - run: python -m scripts.paste_link_julajups_diagnose
