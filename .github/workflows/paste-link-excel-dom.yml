name: Excel Usados exact DOM layout inspection
on:
  pull_request:
    paths:
      - "scripts/paste_link_excel_dom.py"
      - ".github/workflows/paste-link-excel-dom.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  three-vehicle-layouts:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install httpx==0.27.2 beautifulsoup4==4.12.3
      - run: python scripts/paste_link_excel_dom.py
