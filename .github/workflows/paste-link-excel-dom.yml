name: Excel Usados exact DOM layout inspection
# One-time source access test completed. Manual revalidation only.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  three-vehicle-layouts:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install httpx==0.27.2 beautifulsoup4==4.12.3
      - run: python scripts/paste_link_excel_dom.py
