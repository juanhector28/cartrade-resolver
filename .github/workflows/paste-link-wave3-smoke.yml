name: Carly five-source staging field audit
on:
  pull_request:
    paths:
      - "scripts/paste_link_wave3_smoke.py"
      - ".github/workflows/paste-link-wave3-smoke.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  limited-five:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install minimal HTTP client
        run: python -m pip install httpx==0.27.2
      - name: Check five Atlas-observed user-level vehicle URLs, no crawling
        run: python scripts/paste_link_wave3_smoke.py
      - name: Keep bounded per-field report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: carly-wave3-field-audit-${{ github.run_id }}
          path: /tmp/paste-link-wave3-audit.json
          retention-days: 7
          if-no-files-found: warn
