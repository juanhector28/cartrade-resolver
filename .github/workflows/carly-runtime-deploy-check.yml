name: Carly runtime deploy check

# ZERO model calls. Poll runtime identity plus read-only financing/browser readiness.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: carly-runtime-deploy-check
  cancel-in-progress: true

jobs:
  verify-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Wait for Render to serve latest runtime code and financing bridge
        env:
          CARLY_BASE_URL: https://cartrade-resolver.onrender.com
        run: |
          EXPECTED_SHA="$(git log -1 --format=%H -- app Dockerfile requirements.txt railway.toml)"
          export EXPECTED_SHA
          python - <<'PY'
          import json, os, subprocess, time, urllib.error, urllib.request
          base = os.environ["CARLY_BASE_URL"]
          expected = os.environ["EXPECTED_SHA"]
          runtime_paths = ["app", "Dockerfile", "requirements.txt", "railway.toml"]

          def same_runtime_tree(deployed):
              if not deployed:
                  return False
              if deployed == expected:
                  return True
              try:
                  probe = subprocess.run(["git", "diff", "--quiet", expected, deployed, "--", *runtime_paths], check=False)
                  return probe.returncode == 0
              except Exception:
                  return False

          def health_status():
              try:
                  with urllib.request.urlopen(base + "/health", timeout=5) as r:
                      return r.status
              except urllib.error.HTTPError as exc:
                  return exc.code
              except Exception:
                  return None

          for attempt in range(1, 91):
              health = health_status()
              try:
                  with urllib.request.urlopen(base + "/carly/runtime", timeout=10) as r:
                      runtime = json.loads(r.read().decode("utf-8"))
                  deployed = runtime.get("git_commit")
                  composition = runtime.get("composition")
                  runtime_tree_ok = same_runtime_tree(deployed)
                  capabilities_ok = (
                      isinstance(composition, str)
                      and composition.startswith("commercial-v")
                      and runtime.get("intake_fastpath") is True
                      and runtime.get("quality_gate") is True
                      and runtime.get("explore_quality_gate") is True
                      and runtime.get("default_curated_recommendations") == 3
                      and runtime.get("more_options_precedence") is True
                      and runtime.get("model_intelligence_precedence") is True
                      and runtime.get("buy_decision_precedence") is True
                  )
                  runtime_ok = runtime_tree_ok and capabilities_ok
                  phase = "ready_candidate" if runtime_ok else "stale_or_incomplete_runtime"

                  financing_ok = pilot_ok = auth_ok = cors_ok = False
                  if runtime_ok:
                      with urllib.request.urlopen(base + "/financing/readiness", timeout=10) as r:
                          financing = json.loads(r.read().decode("utf-8"))
                      financing_ok = (
                          financing.get("status") == "ready"
                          and financing.get("financing_bridge") == "v20"
                          and financing.get("integration_mode") == "SHADOW"
                          and financing.get("transactions_configured") is True
                          and financing.get("transactions_authenticated") is True
                          and financing.get("requires_authenticated_user") is True
                      )
                      pilot_ok = (
                          financing.get("pilot_router_autopromote") is True
                          and financing.get("pilot_evidence_mode") == "synthetic_shadow"
                      )
                      with urllib.request.urlopen(base + "/auth/config", timeout=10) as r:
                          auth = json.loads(r.read().decode("utf-8"))
                      auth_ok = auth.get("provider") == "supabase" and bool(auth.get("url")) and bool(auth.get("publishable_key"))
                      req = urllib.request.Request(
                          base + "/financing/intake", method="OPTIONS",
                          headers={
                              "Origin": "https://cartrade.live",
                              "Access-Control-Request-Method": "POST",
                              "Access-Control-Request-Headers": "authorization,content-type",
                          },
                      )
                      with urllib.request.urlopen(req, timeout=10) as r:
                          allow_origin = r.headers.get("Access-Control-Allow-Origin", "")
                          allow_headers = r.headers.get("Access-Control-Allow-Headers", "").lower()
                      cors_ok = allow_origin == "https://cartrade.live" and "authorization" in allow_headers

                  print({"attempt": attempt, "phase": phase, "health_http": health, "composition": composition,
                         "deployed": deployed, "expected_runtime_sha": expected, "runtime_tree_ready": runtime_tree_ok,
                         "capabilities_ready": capabilities_ok, "runtime_ready": runtime_ok,
                         "more_options_precedence": runtime.get("more_options_precedence"),
                         "model_intelligence_precedence": runtime.get("model_intelligence_precedence"),
                         "buy_decision_precedence": runtime.get("buy_decision_precedence"),
                         "financing_ready": financing_ok, "pilot_router_ready": pilot_ok,
                         "public_auth_ready": auth_ok, "browser_cors_ready": cors_ok})
                  if runtime_ok and financing_ok and pilot_ok and auth_ok and cors_ok:
                      print("RENDER_DEPLOY_GATE=PASS")
                      raise SystemExit(0)
              except SystemExit:
                  raise
              except urllib.error.HTTPError as exc:
                  phase = "deploy_transition" if exc.code in {502, 503, 504} else "http_error"
                  print({"attempt": attempt, "phase": phase, "health_http": health, "runtime_http": exc.code,
                         "expected_runtime_sha": expected})
              except Exception as exc:
                  print({"attempt": attempt, "phase": "transport_error", "health_http": health,
                         "error_type": type(exc).__name__, "error": str(exc), "expected_runtime_sha": expected})
              time.sleep(10)
          raise SystemExit("Render did not expose the expected Carly runtime capabilities and authenticated financing bridge within the deploy window")
          PY
