name: Carly runtime deploy check

# ZERO model calls. Poll runtime identity plus read-only financing/browser readiness.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: carly-runtime-deploy-check
  cancel-in-progress: true

jobs:
  verify-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Wait for Render to serve this commit and financing bridge
        env:
          CARLY_BASE_URL: https://cartrade-resolver.onrender.com
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          python - <<'PY'
          import json, os, time, urllib.request
          base = os.environ["CARLY_BASE_URL"]
          expected = os.environ["EXPECTED_SHA"]
          deployed_checks = 0
          runtime_ok = False
          for attempt in range(1, 37):
              try:
                  with urllib.request.urlopen(base + "/carly/runtime", timeout=10) as r:
                      runtime = json.loads(r.read().decode("utf-8"))
                  deployed = runtime.get("git_commit")
                  composition = runtime.get("composition")
                  runtime_ok = composition == "commercial-v20-financing-bridge" and deployed == expected

                  financing = {}
                  financing_ok = False
                  pilot_ok = False
                  auth_ok = False
                  cors_ok = False
                  if runtime_ok:
                      deployed_checks += 1
                      with urllib.request.urlopen(base + "/financing/readiness", timeout=10) as r:
                          financing = json.loads(r.read().decode("utf-8"))
                      financing_ok = (
                          financing.get("status") == "ready"
                          and financing.get("financing_bridge") == "v20"
                          and financing.get("integration_mode") == "SHADOW"
                          and financing.get("transactions_configured") is True
                          and financing.get("transactions_authenticated") is True
                          and financing.get("requires_authenticated_user") is True
                      )
                      pilot_ok = (
                          financing.get("pilot_router_autopromote") is True
                          and financing.get("pilot_evidence_mode") == "synthetic_shadow"
                      )

                      with urllib.request.urlopen(base + "/auth/config", timeout=10) as r:
                          auth = json.loads(r.read().decode("utf-8"))
                      auth_ok = (
                          auth.get("provider") == "supabase"
                          and bool(auth.get("url"))
                          and bool(auth.get("publishable_key"))
                      )

                      req = urllib.request.Request(
                          base + "/financing/intake",
                          method="OPTIONS",
                          headers={
                              "Origin": "https://cartrade.live",
                              "Access-Control-Request-Method": "POST",
                              "Access-Control-Request-Headers": "authorization,content-type",
                          },
                      )
                      with urllib.request.urlopen(req, timeout=10) as r:
                          allow_origin = r.headers.get("Access-Control-Allow-Origin", "")
                          allow_headers = r.headers.get("Access-Control-Allow-Headers", "").lower()
                      cors_ok = (
                          allow_origin == "https://cartrade.live"
                          and "authorization" in allow_headers
                      )

                  print({
                      "attempt": attempt,
                      "composition": composition,
                      "deployed": deployed,
                      "expected": expected,
                      "runtime_ready": runtime_ok,
                      "financing_ready": financing_ok,
                      "pilot_router_ready": pilot_ok,
                      "public_auth_ready": auth_ok,
                      "browser_cors_ready": cors_ok,
                  })
                  if runtime_ok and financing_ok and pilot_ok and auth_ok and cors_ok:
                      raise SystemExit(0)
                  if runtime_ok and deployed_checks >= 3:
                      raise SystemExit("Expected runtime is deployed but browser financing / pilot Router readiness failed")
              except SystemExit:
                  raise
              except Exception as exc:
                  print(f"attempt {attempt}: {type(exc).__name__}: {exc}")
                  if runtime_ok and deployed_checks >= 3:
                      raise SystemExit("Expected runtime is deployed but browser financing / pilot Router readiness failed")
              time.sleep(10)
          raise SystemExit("Render did not expose the expected Carly runtime and authenticated financing bridge in time")
          PY
