name: Carly Paste Link staging browser E2E

# Manual only after first confirmed success to avoid repeated third-party requests.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  staging-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install browser dependencies
        run: |
          python -m pip install playwright==1.48.0 httpx==0.27.2
          python -m playwright install --with-deps chromium
      - name: Check full Carly link-to-photo journey
        run: python scripts/paste_link_staging_e2e.py
      - name: Upload screenshot and validation receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: carly-staging-browser-e2e-${{ github.run_id }}
          path: /tmp/carly-staging-browser
          if-no-files-found: warn
          retention-days: 7
