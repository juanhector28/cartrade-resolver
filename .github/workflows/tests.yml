name: Resolver tests

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  atlas-inventory-api:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install focused test dependencies
        run: python -m pip install fastapi==0.115.0 pytest
      - name: Run Atlas inventory API tests
        run: python -m pytest -q tests/test_atlas_inventory_api.py
      - name: Run Carly objective guardrail tests
        run: python -m pytest -q tests/test_carly_guardrails.py
      - name: Run Carly decision state tests
        run: python -m pytest -q tests/test_carly_decision_state.py
      - name: Run Carly UI contract tests
        run: python -m pytest -q tests/test_carly_ui_contract.py
      - name: Run Carly decision integrity tests
        run: python -m pytest -q tests/test_carly_decision_integrity.py
      - name: Check Carly production entrypoint
        run: grep -q "CMD uvicorn app.main_state:app" Dockerfile
      - name: Check patch syntax
        run: python -m py_compile app/atlas_inventory_api.py resolver_patch_atlas_v17.py app/carly_guardrails.py app/carly_state.py app/carly_ui_contract.py app/main_guarded.py app/main_decision.py app/main_state.py tests/live_carly_objective_smoke.py tests/live_carly_followup_smoke.py tests/live_carly_followup_smoke_v2.py tests/live_carly_reset_smoke.py
