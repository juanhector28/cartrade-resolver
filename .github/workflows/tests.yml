name: Resolver tests

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  atlas-inventory-api:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install focused test dependencies
        run: python -m pip install fastapi==0.115.0 pytest
      - name: Run Atlas inventory API tests
        run: python -m pytest -q tests/test_atlas_inventory_api.py
      - name: Run Carly objective guardrail tests
        run: python -m pytest -q tests/test_carly_guardrails.py
      - name: Check patch syntax
        run: python -m py_compile app/atlas_inventory_api.py resolver_patch_atlas_v17.py app/carly_guardrails.py app/main_guarded.py
