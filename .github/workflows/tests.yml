name: Resolver tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  atlas-inventory-api:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install test dependencies
        run: python -m pip install -r requirements.txt pytest
      - name: Run Atlas inventory API tests
        run: python -m pytest -q tests/test_atlas_inventory_api.py
      - name: Run Carly objective guardrail tests
        run: python -m pytest -q tests/test_carly_guardrails.py
      - name: Run Carly decision state tests
        run: python -m pytest -q tests/test_carly_decision_state.py
      - name: Run Carly UI contract tests
        run: python -m pytest -q tests/test_carly_ui_contract.py
      - name: Run Carly decision integrity tests
        run: python -m pytest -q tests/test_carly_decision_integrity.py
      - name: Run Carly Decision Room tests
        run: python -m pytest -q tests/test_carly_decision_room.py
      - name: Run Carly preview-first tests
        run: python -m pytest -q tests/test_carly_preview_first.py
      - name: Run Carly commercial advisory tests
        run: python -m pytest -q tests/test_carly_commercial.py
      - name: Run Carly zero-token fastpath tests
        run: python -m pytest -q tests/test_carly_fastpath.py
      - name: Run Carly recommendation quality tests
        run: python -m pytest -q tests/test_carly_quality_gate.py
      - name: Run Carly stale-state regression tests
        run: python -m pytest -q tests/test_carly_v7.py
      - name: Run Carly frontend-context regression tests
        run: python -m pytest -q tests/test_carly_v8.py
      - name: Run Carly advisor intelligence tests
        run: python -m pytest -q tests/test_carly_advisor.py
      - name: Run Carly v10 verification brief tests
        run: python -m pytest -q tests/test_carly_v10.py
      - name: Run Carly v11 state/brief routing tests
        run: python -m pytest -q tests/test_carly_v11.py
      - name: Run Carly v12 UI-contract hotfix tests
        run: python -m pytest -q tests/test_carly_v12.py
      - name: Run Carly v13 presentation/market-truth tests
        run: python -m pytest -q tests/test_carly_v13.py
      - name: Run Carly v15 continuation tests
        run: python -m pytest -q tests/test_carly_v15.py
      - name: Run Carly v16 dynamic-state tests
        run: python -m pytest -q tests/test_carly_v16.py
      - name: Run Carly v17 recommendation-set tests
        run: python -m pytest -q tests/test_carly_v17.py
      - name: Run Carly v18 recurring-regression tests
        run: python -m pytest -q tests/test_carly_v18.py
      - name: Run Carly v19 E2E breadth tests
        run: python -m pytest -q tests/test_carly_v19.py
      - name: Run Carly v20 financing bridge tests
        run: python -m pytest -q tests/test_financing_bridge_v20.py
      - name: Run Carly v20 customer financing intake tests
        run: python -m pytest -q tests/test_financing_intake_v20.py
      - name: Run sandbox Router pilot promoter tests
        run: python -m pytest -q tests/test_pilot_financing_promoter.py
      - name: Run Carly v20 public auth config tests
        run: python -m pytest -q tests/test_public_auth_v20.py
      - name: Run Carly v26 intelligence v4 tests
        run: python -m pytest -q tests/test_carly_intake_v26.py tests/test_carly_profile_v4.py
      - name: Run Carly v31 hard-constraint regressions
        run: python -m pytest -q tests/test_carly_v31.py
      - name: Run Carly v32 demo-guard regressions
        run: python -m pytest -q tests/test_carly_v32.py
      - name: Run original stress15 against Carly v33
        run: python -m pytest -q tests/test_carly_v32_stress15.py
      - name: Run Carly v33 complex15 regressions
        run: python -m pytest -q tests/test_carly_v33_complex15.py
      - name: Run Carly v34 demo-safety regressions
        run: python -m pytest -q tests/test_carly_v34.py
      - name: Run Carly v35 session-fact regressions
        env:
          CACHE_DB: /tmp/carly-v35-cache.db
          TRUSTPLUS_DB: /tmp/carly-v35-trustplus.db
        run: python -m pytest -q tests/test_carly_v35.py
      - name: Run Carly v36 cached vision-gate regressions
        env:
          CACHE_DB: /tmp/carly-v36-cache.db
          TRUSTPLUS_DB: /tmp/carly-v36-trustplus.db
          CARLY_VISION_JIT_ENABLED: "0"
        run: python -m pytest -q tests/test_carly_v36.py
      - name: Check Carly production entrypoint
        run: grep -q "CMD uvicorn app.main_v36:app" Dockerfile
      - name: Check patch syntax
        run: python -m py_compile app/atlas_inventory_api.py resolver_patch_atlas_v17.py app/carly_guardrails.py app/carly_state.py app/carly_ui_contract.py app/carly_decision_room.py app/carly_preview_first.py app/carly_commercial.py app/carly_fastpath.py app/carly_quality_gate.py app/carly_advisor.py app/carly_vehicle_brief.py app/carly_profile.py app/financing_bridge.py app/financing_intake_bridge.py app/pilot_financing_promoter.py app/public_auth.py app/main.py app/main_guarded.py app/main_decision.py app/main_state.py app/main_room.py app/main_preview.py app/main_commercial.py app/main_v7.py app/main_v8.py app/main_v9.py app/main_v10.py app/main_v11.py app/main_v12.py app/main_v13.py app/main_v14.py app/main_v15.py app/main_v16.py app/main_v17.py app/main_v18.py app/main_v19.py app/main_v20.py app/main_v25.py app/main_v26.py app/main_v27.py app/main_v28.py app/main_v29.py app/main_v30.py app/main_v31.py app/main_v32.py app/main_v33.py app/main_v34.py app/main_v35.py app/main_v36.py tests/test_carly_v31.py tests/test_carly_v32.py tests/test_carly_v32_stress15.py tests/test_carly_v33_complex15.py tests/test_carly_v34.py tests/test_carly_v35.py tests/test_carly_v36.py tests/test_carly_profile_v4.py tests/test_financing_bridge_v20.py tests/test_financing_intake_v20.py tests/test_pilot_financing_promoter.py tests/test_public_auth_v20.py tests/live_carly_objective_smoke.py tests/live_carly_followup_smoke.py tests/live_carly_followup_smoke_v2.py tests/live_carly_reset_smoke.py tests/live_carly_ui_context_smoke.py tests/live_carly_preview_smoke.py
