name: Resolver tests

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Probe Render health and runtime once
        run: |
          set +e
          echo '--- /health ---'
          curl -sS -i --max-time 15 https://cartrade-resolver.onrender.com/health
          echo
          echo '--- /carly/runtime ---'
          curl -sS -i --max-time 15 https://cartrade-resolver.onrender.com/carly/runtime
          echo
          exit 0
