name: Resolver tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  atlas-inventory-api:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install test dependencies
        run: python -m pip install -r requirements.txt pytest
      - name: Run Atlas inventory API tests
        run: python -m pytest -q tests/test_atlas_inventory_api.py
      - name: Run Carly objective guardrail tests
        run: python -m pytest -q tests/test_carly_guardrails.py
      - name: Run Carly decision state tests
        run: python -m pytest -q tests/test_carly_decision_state.py
      - name: Run Carly UI contract tests
        run: python -m pytest -q tests/test_carly_ui_contract.py
      - name: Run Carly decision integrity tests
        run: python -m pytest -q tests/test_carly_decision_integrity.py
      - name: Run Carly Decision Room tests
        run: python -m pytest -q tests/test_carly_decision_room.py
      - name: Run Carly preview-first tests
        run: python -m pytest -q tests/test_carly_preview_first.py
      - name: Run Carly commercial advisory tests
        run: python -m pytest -q tests/test_carly_commercial.py
      - name: Run Carly zero-token fastpath tests
        run: python -m pytest -q tests/test_carly_fastpath.py
      - name: Run Carly recommendation quality tests
        run: python -m pytest -q tests/test_carly_quality_gate.py
      - name: Run Carly stale-state regression tests
        run: python -m pytest -q tests/test_carly_v7.py
      - name: Run Carly frontend-context regression tests
        run: python -m pytest -q tests/test_carly_v8.py
      - name: Run Carly advisor intelligence tests
        run: python -m pytest -q tests/test_carly_advisor.py
      - name: Run Carly v10 verification brief tests
        run: python -m pytest -q tests/test_carly_v10.py
      - name: Run Carly v11 state/brief routing tests
        run: python -m pytest -q tests/test_carly_v11.py
      - name: Run Carly v12 UI-contract hotfix tests
        run: python -m pytest -q tests/test_carly_v12.py
      - name: Run Carly v13 presentation/market-truth tests
        run: python -m pytest -q tests/test_carly_v13.py
      - name: Check Carly production entrypoint
        run: grep -q "CMD uvicorn app.main_v13:app" Dockerfile
      - name: Check patch syntax
        run: python -m py_compile app/atlas_inventory_api.py resolver_patch_atlas_v17.py app/carly_guardrails.py app/carly_state.py app/carly_ui_contract.py app/carly_decision_room.py app/carly_preview_first.py app/carly_commercial.py app/carly_fastpath.py app/carly_quality_gate.py app/carly_advisor.py app/carly_vehicle_brief.py app/main_guarded.py app/main_decision.py app/main_state.py app/main_room.py app/main_preview.py app/main_commercial.py app/main_v7.py app/main_v8.py app/main_v9.py app/main_v10.py app/main_v11.py app/main_v12.py app/main_v13.py tests/live_carly_objective_smoke.py tests/live_carly_followup_smoke.py tests/live_carly_followup_smoke_v2.py tests/live_carly_reset_smoke.py tests/live_carly_ui_context_smoke.py tests/live_carly_preview_smoke.py
