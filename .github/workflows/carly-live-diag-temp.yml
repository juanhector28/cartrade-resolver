name: Carly live diagnostic temp
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe live Carly production
        run: |
          python - <<'PY'
          import json, urllib.request, urllib.error
          base="https://cartrade-resolver.onrender.com"
          def post(label,payload):
              data=json.dumps(payload).encode()
              req=urllib.request.Request(base+"/carly/search",data=data,headers={"Content-Type":"application/json"},method="POST")
              try:
                  with urllib.request.urlopen(req, timeout=40) as r:
                      body=json.loads(r.read().decode("utf-8"))
                      print(label, "HTTP", r.status, "pool", body.get("pool_matching"), "count", body.get("count"), "intent", body.get("intent"))
                      for x in (body.get("results") or [])[:2]:
                          print(label, "ROW", {k:x.get(k) for k in ("id","country","make","model","body_type","is_addressable","price_usd")})
              except urllib.error.HTTPError as e:
                  print(label,"HTTPERR",e.code,e.read().decode("utf-8")[:3000])
              except Exception as e:
                  print(label,"ERR",repr(e))
          post("GT_ANY_ADDR_TRUE",{"q":"","country":"gt","limit":3,"addressable_only":True})
          post("GT_ANY_ADDR_FALSE",{"q":"","country":"gt","limit":3,"addressable_only":False})
          post("GT_SUV_ADDR_TRUE",{"q":"SUV","country":"gt","limit":3,"addressable_only":True})
          post("GT_SUV_ADDR_FALSE",{"q":"SUV","country":"gt","limit":3,"addressable_only":False})
          post("ALL_ANY_ADDR_TRUE",{"q":"","limit":3,"addressable_only":True})
          PY
