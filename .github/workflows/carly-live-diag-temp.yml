name: Carly live diagnostic temp
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check production runtime
        run: |
          python - <<'PY'
          import urllib.request
          for path in ["/health","/carly/runtime"]:
              with urllib.request.urlopen("https://cartrade-resolver.onrender.com"+path,timeout=30) as r:
                  print(path,"HTTP",r.status,r.read().decode("utf-8")[:5000])
          PY
