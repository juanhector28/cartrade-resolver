name: Carly live diagnostic temp
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify SV Carly after live source refresh
        run: |
          python - <<'PY'
          import json, urllib.request
          base="https://cartrade-resolver.onrender.com"
          payload={"country":"sv","top_n":3,"shown_cars":[],"messages":[
            {"role":"user","content":"Busco un SUV familiar confiable, hasta USD 500 al mes, para uso diario."}
          ]}
          data=json.dumps(payload).encode()
          req=urllib.request.Request(base+"/carly/chat",data=data,headers={"Content-Type":"application/json"},method="POST")
          with urllib.request.urlopen(req,timeout=45) as r:
              out=json.loads(r.read().decode("utf-8"))
              print("HTTP",r.status)
              print("PHASE",out.get("phase"))
              print("REPLY",out.get("reply"))
              print("RECOMMENDATIONS",len(out.get("recommendations") or []))
              print("EXPLORE",len(out.get("explore") or []))
              print("POOL",out.get("pool_size"),out.get("market_pool_size"))
              for x in (out.get("recommendations") or []):
                  print("CARD",{k:x.get(k) for k in ("id","country","make","model","year","body_type","price_usd","monthly_est","url")})
          PY
