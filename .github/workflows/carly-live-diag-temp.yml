name: Carly live diagnostic temp
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify selected SV listings live
        run: |
          python - <<'PY'
          import urllib.request, urllib.error, re
          listings=[
            (2082272,"https://www.encuentra24.com/el-salvador-es/autos-usados/toyota-raize/33014736","Toyota","Raize","2025"),
            (1993304,"https://www.encuentra24.com/el-salvador-es/autos-usados/honda-hrv-2025/32996677","Honda","HR-V","2025"),
            (2032288,"https://www.encuentra24.com/el-salvador-es/autos-usados/vendomitsubishi-outlander-sport-4wd-ano-2024/33007783","Mitsubishi","Outlander","2024"),
            (2012942,"https://www.encuentra24.com/el-salvador-es/autos-usados/mitsubishi-outlander-sport-2024-se-bolsas-buenas-todas-awd-4x4/33002766","Mitsubishi","Outlander","2024"),
            (2032296,"https://www.encuentra24.com/el-salvador-es/autos-usados/venta-directa/33008007","Honda","HR-V","2025"),
            (983008,"https://www.encuentra24.com/el-salvador-es/autos-usados/vendo-nissan-kicks-s-2025/32802295","Nissan","Kicks","2025"),
            (1026015,"https://www.encuentra24.com/el-salvador-es/autos-usados/honda-hr-v-2025/32802233","Honda","HR-V","2025"),
            (1702568,"https://www.encuentra24.com/el-salvador-es/autos-usados/mitsubishi-outlander-se-3-filas-de-asientos-2022/32924456","Mitsubishi","Outlander","2022"),
          ]
          hdr={"User-Agent":"Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/124 Safari/537.36","Accept-Language":"es-SV,es;q=0.9,en;q=0.7"}
          for id,url,make,model,year in listings:
              try:
                  req=urllib.request.Request(url,headers=hdr)
                  with urllib.request.urlopen(req,timeout=20) as r:
                      raw=r.read(800000).decode("utf-8","ignore")
                      norm=re.sub(r"[^a-z0-9]+"," ",raw.lower())
                      mt=make.lower().replace("-"," ")
                      mod=model.lower().replace("-"," ")
                      ok=(r.status==200 and year in raw and (mt.split()[0] in norm) and any(tok in norm for tok in mod.split() if len(tok)>=3))
                      print("VERIFY",id,"HTTP",r.status,"OK",ok,"FINAL",r.geturl(),"MAKE",make,"MODEL",model,"YEAR",year,"LEN",len(raw))
              except urllib.error.HTTPError as e:
                  print("VERIFY",id,"HTTPERR",e.code,"OK",False,"URL",url)
              except Exception as e:
                  print("VERIFY",id,"ERR",repr(e),"OK",False,"URL",url)
          PY
