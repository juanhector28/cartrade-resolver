name: Carly live diagnostic temp
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Refresh SV inventory and probe Carly
        run: |
          python - <<'PY'
          import json, time, urllib.request, urllib.error
          base="https://cartrade-resolver.onrender.com"

          def post(path,payload,timeout=240):
              data=json.dumps(payload).encode()
              req=urllib.request.Request(base+path,data=data,headers={"Content-Type":"application/json"},method="POST")
              with urllib.request.urlopen(req, timeout=timeout) as r:
                  raw=r.read().decode("utf-8")
                  print(path, "HTTP", r.status, raw[:7000])
                  return json.loads(raw)

          try:
              refresh=post("/inventory-run",{"country":"sv","pages":2},timeout=360)
              print("SV_REFRESH_SUMMARY",json.dumps(refresh,ensure_ascii=False)[:7000])
          except Exception as exc:
              print("SV_REFRESH_ERR",repr(exc))

          payload={"country":"sv","top_n":3,"shown_cars":[],"messages":[
              {"role":"user","content":"Busco un SUV familiar confiable, hasta USD 500 al mes, para uso diario."}
          ]}
          try:
              out=post("/carly/chat",payload,timeout=45)
              print("SV_CHAT_VERIFY",json.dumps({
                  "phase":out.get("phase"),
                  "reply":out.get("reply"),
                  "recommendations_count":len(out.get("recommendations") or []),
                  "explore_count":len(out.get("explore") or []),
                  "token_path":out.get("token_path"),
              },ensure_ascii=False))
              for x in (out.get("recommendations") or [])[:3]:
                  print("SV_CARD",{k:x.get(k) for k in ("id","country","make","model","body_type","price_usd","monthly_est","url")})
          except Exception as exc:
              print("SV_CHAT_ERR",repr(exc))
              raise
          PY
