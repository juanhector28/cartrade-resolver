name: Carly v43 stage timing

on:
  pull_request:
    paths:
      - 'app/main_v43.py'
      - 'Dockerfile'
      - '.github/workflows/carly-v43-stage-timing.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CACHE_DB: /tmp/carly-v43-cache.db
      TRUSTPLUS_DB: /tmp/carly-v43-trustplus.db
      CARLY_VISION_JIT_ENABLED: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt pytest
      - name: Preserve v41 recommendation regressions
        run: python -m pytest -q tests/test_carly_v41.py tests/test_carly_v40.py
      - name: Validate v43 import
        run: python -m py_compile app/main_v42.py app/main_v43.py
