name: CarTrade Link-First Preview
on:
  pull_request:
    paths:
      - "app/link_first_intake.py"
      - "assets/cartrade_link_first_request.js"
      - "previews/link-first/**"
      - "scripts/build_link_first_netlify.py"
      - "scripts/test_link_first_netlify_browser.py"
      - "scripts/test_link_first_live_readonly.py"
      - "tests/test_link_first_intake.py"
      - ".github/workflows/link-first-preview.yml"
  workflow_dispatch:
  push:
    branches:
      - "feat/cartrade-link-first-netlify-preview-20261012"

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install contract and browser dependencies
        run: |
          python -m pip install pytest fastapi==0.115.0 pydantic==2.9.2 httpx==0.27.2 playwright==1.48.0
          python -m playwright install --with-deps chromium
      - name: Syntax and standalone API tests
        run: |
          python -m compileall -q app/link_first_intake.py scripts/build_link_first_netlify.py scripts/test_link_first_netlify_browser.py
          node --check assets/cartrade_link_first_request.js
          python -m pytest -q tests/test_link_first_intake.py
      - name: Browser E2E and mobile
        run: python scripts/test_link_first_netlify_browser.py
      - name: Read-only production smoke for recently deployed HTML
        run: python scripts/test_link_first_live_readonly.py
      - name: Produce Netlify drag-and-drop preview
        run: |
          python scripts/build_link_first_netlify.py --out dist/netlify-preview
          cd dist/netlify-preview
          zip -q -r ../CarTrade_LinkFirst_Netlify_Preview.zip .
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: CarTrade_LinkFirst_LiveSmoke_Report
          path: /tmp/link_first_live_report.json
          if-no-files-found: ignore
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: CarTrade_LinkFirst_Netlify_Preview
          path: dist/CarTrade_LinkFirst_Netlify_Preview.zip
          if-no-files-found: error
          retention-days: 14
