name: Paste Link wave 4 exact sources preflight
on:
  pull_request:
    paths:
      - "scripts/paste_link_wave4_preflight.py"
      - ".github/workflows/paste-link-wave4-preflight.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  five-public-pages:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-paste-link-staging.txt
      - run: python -m scripts.paste_link_wave4_preflight
