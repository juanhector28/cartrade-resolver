name: Carly v59 safe fallback

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fallback-boundary:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CACHE_DB: /tmp/carly-v59-fallback-cache.db
      TRUSTPLUS_DB: /tmp/carly-v59-fallback-trustplus.db
      CARLY_VISION_JIT_ENABLED: "0"
      CARLY_VISION_INLINE_MAX: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt pytest
      - name: Verify same-boundary fail-closed fallback
        run: python -m pytest -q tests/test_carly_v59_safe_fallback.py
      - name: Check fallback syntax
        run: python -m py_compile app/carly_v59_safe_fallback.py app/main_v51.py tests/test_carly_v59_safe_fallback.py
