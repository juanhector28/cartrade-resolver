name: Debug v40 parser
on:
  push:
    branches: [carly-v39-constraint-semantics]
permissions:
  contents: read
jobs:
  debug:
    runs-on: ubuntu-latest
    env:
      CACHE_DB: /tmp/debug-v40-cache.db
      TRUSTPLUS_DB: /tmp/debug-v40-trustplus.db
      CARLY_VISION_JIT_ENABLED: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt >/dev/null
      - run: |
          python - <<'PY'
          from app import main_v40 as v
          text='Estoy buscando una Honda CRV 2023 o más nueva, automática, máximo US$500 al mes. Si no hay una CR-V exacta que cumpla, primero dímelo claramente y después puedes enseñarme máximo 3 alternativas similares de Toyota, Mazda o Subaru. Nada de Nissan.'
          body={'messages':[{'role':'user','content':text}],'country':'sv'}
          base=v._ORIG_CONSTRAINTS(body)
          actual_text=str(base.get('text') or '')
          cand=v._candidate_exact(actual_text)
          strong=v._primary_search_exact(actual_text,cand)
          print('BASE_TEXT=',repr(actual_text))
          print('BASE_EXACT=',base.get('exact'))
          print('CAND=',cand)
          print('STRONG=',strong)
          print('MENTIONS=',v.v39._model_mentions(actual_text))
          print('FINAL=',v._constraints(body))
          PY
