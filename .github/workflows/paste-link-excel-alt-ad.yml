name: Excel Usados alternate live ad check
on:
  pull_request:
    paths:
      - "scripts/paste_link_excel_alt_ad_check.py"
      - ".github/workflows/paste-link-excel-alt-ad.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  exact-three-urls:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-paste-link-staging.txt
      - run: python -m scripts.paste_link_excel_alt_ad_check
