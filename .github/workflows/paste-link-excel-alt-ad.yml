name: Excel Usados alternate live ad check
# One-time source access test completed. Manual revalidation only.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  exact-three-urls:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-paste-link-staging.txt
      - run: python -m scripts.paste_link_excel_alt_ad_check
