name: Carly v35 regression

on:
  pull_request:
    paths:
      - 'app/main_v35.py'
      - 'tests/test_carly_v35.py'
      - 'Dockerfile'
      - '.github/workflows/carly-v35-regression.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  v35-session-facts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt pytest
      - name: Run v35 regressions
        run: python -m pytest -q tests/test_carly_v35.py
      - name: Check entrypoint and syntax
        run: |
          grep -q 'CMD uvicorn app.main_v35:app' Dockerfile
          python -m py_compile app/main_v35.py tests/test_carly_v35.py
