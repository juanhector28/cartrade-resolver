name: Carly v52 truth and brief

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt pytest
      - name: Run v51 preservation regressions
        env:
          CACHE_DB: /tmp/carly-v51-cache.db
          TRUSTPLUS_DB: /tmp/carly-v51-trustplus.db
          CARLY_VISION_JIT_ENABLED: "0"
        run: python -m pytest -q tests/test_carly_v51.py
      - name: Run v52 truth and vehicle-brief regressions
        env:
          CACHE_DB: /tmp/carly-v52-cache.db
          TRUSTPLUS_DB: /tmp/carly-v52-trustplus.db
          CARLY_VISION_JIT_ENABLED: "0"
        run: python -m pytest -q tests/test_carly_v52.py
      - name: Check production entrypoint
        run: grep -q '^CMD uvicorn app.main_v52:app' Dockerfile
      - name: Compile patch
        run: python -m py_compile app/main_v52.py tests/test_carly_v52.py
