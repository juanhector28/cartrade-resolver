name: Deals API safety checks
on:
  pull_request:
    paths:
      - 'app/deals_api.py'
      - 'tests/test_deals_api.py'
      - '.github/workflows/deals-api-tests.yml'
  push:
    branches: ['feat/carly-deals-multirol']
    paths:
      - 'app/deals_api.py'
      - 'tests/test_deals_api.py'
      - '.github/workflows/deals-api-tests.yml'
jobs:
  test-deals-api:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install isolated Deals API test dependencies
        run: python -m pip install 'fastapi==0.115.0' 'httpx==0.27.2' 'pydantic==2.9.2' 'supabase==2.7.4' 'pytest>=8,<9'
      - name: Validate Python syntax
        run: python -m py_compile app/deals_api.py tests/test_deals_api.py
      - name: Run Deals API tests
        run: python -m pytest tests/test_deals_api.py -q
