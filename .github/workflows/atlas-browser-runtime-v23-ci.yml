name: Atlas browser runtime v23

on:
  pull_request:
    paths:
      - "resolver_patch_atlas_v23.py"
      - "resolver_patch_atlas_v22.py"
      - "Dockerfile"
      - "railway.toml"
      - ".github/workflows/atlas-browser-runtime-v23-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - name: Verify Railway uses current composition
        run: |
          grep -q 'uvicorn app.main_v41:app' railway.toml
          grep -q 'resolver_patch_atlas_v23.py' Dockerfile

      - name: Build exact production image
        run: docker build -t resolver-v23:local .

      - name: Verify Atlas routes and browser limits
        run: |
          docker run --rm -i --memory=512m             -e ATLAS_BROWSER_RUN_CONCURRENCY=2             -e ATLAS_BROWSER_PAGE_CONCURRENCY=1             resolver-v23:local python - <<'PY'
          from app.atlas_manifest_runner import AtlasManifestRunner
          from app.main_v41 import app

          runner = AtlasManifestRunner(supabase=None)
          assert runner.browser_run_concurrency == 2
          assert runner.browser_page_concurrency == 1
          paths = {getattr(route, 'path', None) for route in app.routes}
          assert '/atlas/run-source' in paths, sorted(x for x in paths if x)
          assert '/atlas/runner/status' in paths, sorted(x for x in paths if x)
          print('ATLAS_V23_ROUTE_CONTRACT=PASS')
          PY

      - name: Stress three concurrent browser runs
        run: |
          docker run --rm -i --memory=512m             -e ATLAS_BROWSER_RUN_CONCURRENCY=2             -e ATLAS_BROWSER_PAGE_CONCURRENCY=1             -e ATLAS_RUNNER_TIMEOUT=8             resolver-v23:local python - <<'PY'
          import asyncio
          import threading
          from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer
          from app.atlas_manifest_runner import AtlasManifestRunner

          DETAIL = '''<!doctype html><html><body>
          <h1>Toyota Corolla 2022</h1>
          <div class="make">Toyota</div>
          <div class="model">Corolla</div>
          <div class="year">2022</div>
          <div class="price">$15,500</div>
          <img class="photo" src="https://example.test/car.jpg">
          </body></html>'''

          class Handler(BaseHTTPRequestHandler):
              def do_GET(self):
                  if self.path == '/inventory':
                      links = ''.join(
                          f'<a href="/autos/vehicle/{1000+i}">Car {i}</a>'
                          for i in range(6)
                      )
                      body = f'<!doctype html><html><body>{links}</body></html>'
                  elif self.path.startswith('/autos/vehicle/'):
                      body = DETAIL
                  else:
                      self.send_response(404); self.end_headers(); return
                  data = body.encode()
                  self.send_response(200)
                  self.send_header('Content-Type', 'text/html; charset=utf-8')
                  self.send_header('Content-Length', str(len(data)))
                  self.end_headers()
                  self.wfile.write(data)
              def log_message(self, *args):
                  pass

          server = ThreadingHTTPServer(('127.0.0.1', 8765), Handler)
          thread = threading.Thread(target=server.serve_forever, daemon=True)
          thread.start()

          manifest = {
              'base_url': 'http://127.0.0.1:8765',
              'start_urls': ['http://127.0.0.1:8765/inventory'],
              'crawl_rendering': 'browser',
              'listing_url_selector': 'a[href]',
              'listing_url_attribute': 'href',
              'required_fields': ['title', 'make', 'model', 'year', 'price_usd'],
              'fields': {
                  'title': {'required': True, 'methods': [{'kind': 'css', 'selector': 'h1'}]},
                  'make': {'required': True, 'methods': [{'kind': 'css', 'selector': '.make'}]},
                  'model': {'required': True, 'methods': [{'kind': 'css', 'selector': '.model'}]},
                  'year': {'required': True, 'methods': [{'kind': 'css', 'selector': '.year', 'transform': 'year_int'}]},
                  'price_usd': {'required': True, 'methods': [{'kind': 'css', 'selector': '.price', 'transform': 'money_to_usd_number'}]},
                  'photos': {'required': False, 'methods': [{'kind': 'attribute', 'selector': '.photo', 'attribute': 'src', 'transform': 'image_list'}]},
              },
          }

          async def main():
              runner = AtlasManifestRunner(supabase=None)
              async def run_one(i):
                  return await runner.run(
                      source_id=f'gt-fixture-{i}',
                      country='GT',
                      domain='127.0.0.1',
                      manifest=manifest,
                      manifest_version=23,
                      limit=2,
                      scan_limit=6,
                      persist=False,
                  )
              results = await asyncio.gather(*(run_one(i) for i in range(3)))
              for result in results:
                  assert result['ok'] is True, result
                  assert result['valid_listings'] >= 2, result
                  assert result['attempted'] >= 2, result
              assert runner._browser_run_semaphore._value == 2
              print('ATLAS_V23_CONCURRENT_BROWSER_SMOKE=PASS')
              print([(r['attempted'], r['valid_listings'], r['elapsed_seconds']) for r in results])

          try:
              asyncio.run(main())
          finally:
              server.shutdown()
          PY
