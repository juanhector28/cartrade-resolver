name: Carly v37 spicy hardening regression

on:
  pull_request:
    paths:
      - 'app/main_v37.py'
      - 'tests/test_carly_v37.py'
      - 'Dockerfile'
      - '.github/workflows/carly-v37-regression.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  v37-spicy-hardening:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      CACHE_DB: /tmp/carly-v37-cache.db
      TRUSTPLUS_DB: /tmp/carly-v37-trustplus.db
      CARLY_VISION_JIT_ENABLED: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt pytest
      - name: Run v37 regressions
        run: python -m pytest -q tests/test_carly_v37.py
      - name: Check entrypoint and syntax
        run: |
          grep -q 'CMD uvicorn app.main_v37:app' Dockerfile
          python -m py_compile app/main_v37.py tests/test_carly_v37.py
