name: Carly follow-up production smoke

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  followup-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify Carly follow-up quality after deploy
        env:
          CARLY_BASE_URL: https://cartrade-resolver.onrender.com
        run: |
          for attempt in 1 2 3 4 5 6 7 8; do
            echo "Carly follow-up smoke attempt $attempt"
            if python tests/live_carly_followup_smoke.py; then
              exit 0
            fi
            sleep 20
          done
          echo "Carly follow-up quality smoke failed after deploy window"
          exit 1
