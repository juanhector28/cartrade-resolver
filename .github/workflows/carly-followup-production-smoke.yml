name: Carly follow-up production smoke

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  followup-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify Carly follow-up quality after deploy
        env:
          CARLY_BASE_URL: https://cartrade-resolver.onrender.com
        run: |
          # Render may still be serving the previous image briefly after main moves.
          # Follow-ups, decision reset, expanded-card context, and animation state must pass.
          for attempt in 1 2 3 4 5; do
            echo "Carly follow-up/reset/UI-context smoke attempt $attempt"
            if python tests/live_carly_followup_smoke_v2.py && \
               python tests/live_carly_reset_smoke.py && \
               python tests/live_carly_ui_context_smoke.py; then
              exit 0
            fi
            sleep 20
          done
          echo "Carly follow-up/reset/UI-context quality smoke failed after deploy window"
          exit 1
