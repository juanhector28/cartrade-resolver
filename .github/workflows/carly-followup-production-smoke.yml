name: Carly follow-up production smoke

# PAID production smoke: manual only. Do not run on every push because these
# live journeys call /carly/chat repeatedly and consume Anthropic tokens.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: carly-followup-production-smoke
  cancel-in-progress: true

jobs:
  followup-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Wait for the exact Carly runtime to reach Render
        env:
          CARLY_BASE_URL: https://cartrade-resolver.onrender.com
        run: |
          for attempt in $(seq 1 24); do
            echo "Render deploy check $attempt"
            if python - <<'PY'
          import json, os, urllib.request
          try:
              with urllib.request.urlopen(os.environ["CARLY_BASE_URL"] + "/carly/runtime", timeout=10) as r:
                  data = json.loads(r.read().decode("utf-8"))
              expected = os.environ.get("GITHUB_SHA")
              deployed = data.get("git_commit")
              ok = data.get("composition") == "commercial-v6-live-regressions" and (not deployed or deployed == expected)
              print({"composition": data.get("composition"), "deployed": deployed, "expected": expected, "ready": ok})
              raise SystemExit(0 if ok else 1)
          except Exception as exc:
              print(f"not ready: {exc}")
              raise SystemExit(1)
          PY
            then
              exit 0
            fi
            sleep 10
          done
          echo "Render never exposed the expected Carly runtime"
          exit 1
      - name: Verify Carly follow-up/reset/UI-context quality
        env:
          CARLY_BASE_URL: https://cartrade-resolver.onrender.com
        run: |
          python tests/live_carly_followup_smoke_v2.py
          python tests/live_carly_reset_smoke.py
          python tests/live_carly_ui_context_smoke.py
