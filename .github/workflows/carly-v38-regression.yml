name: Carly v38 AVIF vision regression

on:
  pull_request:
    paths:
      - 'app/main_v38.py'
      - 'tests/test_carly_v38.py'
      - 'requirements.txt'
      - 'Dockerfile'
      - '.github/workflows/carly-v38-regression.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  v38-avif-vision:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    env:
      CACHE_DB: /tmp/carly-v38-cache.db
      TRUSTPLUS_DB: /tmp/carly-v38-trustplus.db
      CARLY_VISION_JIT_ENABLED: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt pytest
      - name: Run v38 regressions
        run: python -m pytest -q tests/test_carly_v38.py
      - name: Check entrypoint and syntax
        run: |
          grep -q 'CMD uvicorn app.main_v38:app' Dockerfile
          python -m py_compile app/main_v38.py tests/test_carly_v38.py
