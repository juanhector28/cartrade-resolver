name: Paste Link second wave (bounded staging audit)
# One-shot real-source audit completed. Rerun manually only when needed.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  three-known-urls:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install httpx==0.27.2
      - name: Resolve three individual Atlas-cited vehicle URLs via isolated staging
        run: python scripts/paste_link_wave2_smoke.py
      - name: Preserve field-level receipt on success or failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: paste-link-wave2-${{ github.run_id }}
          path: /tmp/paste-link-wave2-audit.json
          if-no-files-found: warn
          retention-days: 7
