name: Atlas Refresh v32 CI

on:
  pull_request:
    paths:
      - "app/atlas_manifest_runner.py"
      - "app/atlas_source_registry.py"
      - "app/atlas_refresh_orchestrator.py"
      - "resolver_patch_atlas_v32.py"
      - "Dockerfile"
      - "tests/test_atlas_refresh_orchestrator_v32.py"
  push:
    branches:
      - "atlas/refresh-orchestrator-v32"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt pytest
      - name: Compile Atlas v32
        run: python -m py_compile app/atlas_manifest_runner.py app/atlas_source_registry.py app/atlas_refresh_orchestrator.py resolver_patch_atlas_v32.py
      - name: Run Atlas v32 tests
        run: python -m pytest -q tests/test_atlas_refresh_orchestrator_v32.py
