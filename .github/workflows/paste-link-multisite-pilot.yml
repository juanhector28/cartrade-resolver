name: Multi-site staging pilot (one-shot)

# Manual after bounded one-shot pilot; prevents repeated public requests.
on:
  pull_request:
    paths:
      - "scripts/paste_link_multisite_pilot.py"
      - ".github/workflows/paste-link-multisite-pilot.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  staging-pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install HTTP client
        run: python -m pip install httpx==0.27.2
      - name: Evaluate exact four individual URLs in staging
        run: python scripts/paste_link_multisite_pilot.py
      - name: Save result receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: carly-multisite-pilot-${{ github.run_id }}
          path: /tmp/carly-multisite-staging-report.json
          retention-days: 7
          if-no-files-found: warn
