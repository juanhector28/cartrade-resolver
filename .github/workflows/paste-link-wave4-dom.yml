name: Paste Link wave four HTML structure diagnostic
# First bounded source audit complete; subsequent checks by manual dispatch only.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  exact-three:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install httpx==0.27.2 beautifulsoup4==4.12.3
      - run: python scripts/paste_link_wave4_dom.py
