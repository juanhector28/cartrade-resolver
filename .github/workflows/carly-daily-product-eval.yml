name: Carly daily product eval

on:
  push:
    branches:
      - ops/carly-daily-eval
  workflow_dispatch:
  schedule:
    - cron: "0 13 * * *"

permissions:
  contents: read

concurrency:
  group: carly-daily-product-eval
  cancel-in-progress: true

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify current Carly production runtime is reachable
        run: |
          python - <<'PY'
          import json, time, urllib.request
          last=None
          for _ in range(18):
              try:
                  with urllib.request.urlopen('https://cartrade-resolver.onrender.com/carly/runtime', timeout=20) as r:
                      last=json.loads(r.read().decode())
                  print(last)
                  composition=str(last.get('composition') or '')
                  if last.get('ok') and composition.startswith('commercial-v'):
                      break
              except Exception as exc:
                  print(type(exc).__name__, exc)
              time.sleep(5)
          else:
              raise AssertionError(last)
          PY
      - name: Run Carly product benchmark v2
        run: python tests/daily_carly_product_eval.py
