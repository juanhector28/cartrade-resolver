name: Carly classic Mustang and Excel Sportage final stage proof
on:
  pull_request:
    paths:
      - "scripts/paste_link_final_two_audit.py"
      - ".github/workflows/paste-link-final-two-audit.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  two-explicit-vehicles:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install httpx==0.27.2
      - run: python scripts/paste_link_final_two_audit.py
      - name: Save checks
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: carly-mustang-excel-final-two
          path: /tmp/carly-two-final-cases.json
          retention-days: 7
          if-no-files-found: warn
